name: Terraform Apply

on:
  push:
    branches-ignore:
      - 'main'

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Add SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ./private.key
          chmod 600 ./private.key

      - name: Apply Terraform
        env:
          SERVER_IP: ${{ vars.SERVER_IP }}
        run: ssh -o "StrictHostKeyChecking no" -i ./private.key root@$SERVER_IP "cd ~/june.pet/terraform && git pull && terraform plan -var-file=secret.tfvars -input=false"